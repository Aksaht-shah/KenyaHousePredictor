<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: url("{{ url_for('static', filename='dashboard-bg.png') }}") no-repeat center center fixed;
      background-size: cover;
    }

    .navbar {
      background-color: rgba(30, 58, 138, 0.95);
      padding: 1rem;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .navbar a:hover {
      color: #cbd5e1;
    }

    .overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      min-height: calc(100vh - 80px);
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 50px 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .container h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #1e3a8a;
      font-size: 26px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
      color: #1f2937;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background-color: #f9fafb;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    input[type="submit"] {
      background-color: #3b82f6;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #2563eb;
    }

    .prediction-box {
      background-color: #e0f2fe;
      border-left: 4px solid #2563eb;
      padding: 12px 16px;
      font-weight: bold;
      color: #1e3a8a;
      border-radius: 8px;
      margin-top: 25px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      .navbar a {
        margin: 0 10px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="navbar">
    <a href="{{ url_for('dashboard') }}">Home</a>
    <a href="{{ url_for('ml_status') }}">Model Status</a>
    <a href="{{ url_for('add_property') }}">Add Property</a>
    <a href="{{ url_for('train_model') }}">Train Model</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="overlay">
    <div class="container">
      <h2>Welcome {{ user.name.upper() }}!</h2>

      <form method="POST" action="{{ url_for('predict') }}">
        <label for="bedrooms">Bedrooms:</label>
        <input type="number" id="bedrooms" name="bedrooms" min="0" required>

        <label for="bathrooms">Bathrooms:</label>
        <input type="number" id="bathrooms" name="bathrooms" min="0" required>

        <label for="size_sqft">Size (sqft):</label>
        <input type="number" id="size_sqft" name="size_sqft" min="1" required>

        <label for="location">Location:</label>
        <select name="location" id="location" required>
          {% for county in counties %}
            <option value="{{ county }}">{{ county }}</option>
          {% endfor %}
        </select>

        <label for="property_type">Property Type:</label>
        <select name="property_type" id="property_type" required>
          {% for ptype in property_types %}
            <option value="{{ ptype }}">{{ ptype }}</option>
          {% endfor %}
        </select>

        <input type="submit" value="Predict House Price">
      </form>

      {% if prediction_text %}
        <div class="prediction-box">
          {{ prediction_text }}
        </div>
      {% endif %}
    </div>
  </div>

</body>
</html>
