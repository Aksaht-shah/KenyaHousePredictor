<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}House Price App{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="{{ url_for('dashboard') }}">Home</a>
      <a href="{{ url_for('ml_status') }}">Model Status</a>
      <a href="{{ url_for('add_property') }}">Add Property</a>
      <a href="{{ url_for('train_model') }}">Train Model</a>
      <a href="{{ url_for('logout') }}" class="logout">Logout</a>
    </div>
  </nav>

  <div class="banner">
    <img src="{{ url_for('static', filename='hero.jpg') }}" alt="Banner Image">
  </div>

  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

</body>
</html>
