<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ auth_title }}</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: url("{{ url_for('static', filename='login-bg.png') }}") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.4); /* dark overlay for contrast */
    }

    .login-card {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1e3a8a;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input[type="text"],
    input[type="password"] {
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background-color: #f9fafb;
    }

    input[type="submit"] {
      padding: 12px;
      background-color: #3b82f6;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #2563eb;
    }

    .links {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .links a {
      color: #1e3a8a;
      font-weight: 600;
      text-decoration: none;
      margin: 0 5px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error {
      color: red;
      text-align: center;
      font-size: 14px;
      margin-top: 15px;
    }

    @media (max-width: 500px) {
      .login-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="login-card">
      <h2>{{ auth_title or 'Login' }}</h2>

      <form method="POST" action="{{ form_action or url_for('login') }}">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <input type="submit" value="{{ auth_action or 'Log In' }}">
      </form>

      <div class="links">
        <p><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
        <p>{{ auth_switch_text or "Don't have an account?" }} 
           <a href="{{ auth_switch_link or url_for('signup') }}">{{ auth_switch_action or 'Register' }}</a>
        </p>
      </div>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="error">
            {% for msg in messages %}
              <p>{{ msg }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
    </div>
  </div>

</body>
</html>
