<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Help Desk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="help-page">
  <div class="form-container">
    <h2>Help Desk</h2>
    <p>If you have any questions or need assistance, please fill out the form below.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('help') }}">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Submit Request</button>
    </form>

    <!-- ✅ Button-styled back -->
    <form action="{{ url_for('dashboard') }}">
      <button type="submit" class="back-button">← Back to Dashboard</button>
    </form>
  </div>
</body>
</html>
