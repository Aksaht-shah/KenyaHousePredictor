<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add New Property</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Link to style.css -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="add-property-page">
  <div class="container">
    <h1>Add New Property</h1>
    
    <!-- ✅ Form with image upload enabled -->
    <form method="POST" action="{{ url_for('add_property') }}" enctype="multipart/form-data">
      
      <label for="name">Property Name</label>
      <input type="text" id="name" name="name" required>

      <label for="location">Location</label>
      <input type="text" id="location" name="location" required>

      <label for="property_type">Property Type</label>
      <select id="property_type" name="property_type" required>
        <option value="">Select Type</option>
        <option value="House">House</option>
        <option value="Apartment">Apartment</option>
        <option value="Villa">Villa</option>
        <option value="Townhouse">Townhouse</option>
        <option value="Bungalow">Bungalow</option>
      </select>

      <label for="city">City</label>
      <select id="city" name="city" required>
        <option value="">Select City</option>
        <option value="Nairobi">Nairobi</option>
        <option value="Mombasa">Mombasa</option>
        <option value="Kisumu">Kisumu</option>
        <option value="Eldoret">Eldoret</option>
        <option value="Thika">Thika</option>
      </select>

      <label for="bedrooms">Bedrooms</label>
      <input type="number" id="bedrooms" name="bedrooms" required min="0">

      <label for="bathrooms">Bathrooms</label>
      <input type="number" id="bathrooms" name="bathrooms" required min="0">

      <label for="size">Size (sq ft)</label>
      <input type="number" id="size" name="size" required min="0">

      <label for="price">Price</label>
      <input type="number" id="price" name="price" required min="0">

      <!-- ✅ Image Upload Field -->
      <label for="image">Upload Property Image</label>
      <input type="file" id="image" name="image" accept="image/*" required>

      <button type="submit">Submit Property</button>
    </form>

    <a href="{{ url_for('dashboard') }}" class="back-link">← Back to Dashboard</a>
  </div>
</body>
</html>
